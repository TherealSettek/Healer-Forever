name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks --lua-version 5.1 install luacheck
      - name: Lint and tests
        run: HF_SKIP_MUTATION=1 ./run-tests.sh
